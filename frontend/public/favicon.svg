<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cn-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cn-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Shield -->
  <path d="M32 4L8 14v18c0 14.8 10.2 28.5 24 32 13.8-3.5 24-17.2 24-32V14L32 4z" fill="url(#cn-grad-primary)" />
  
  <!-- Inner Dark Shield Backdrop -->
  <path d="M32 8L12 16.5v15c0 12.5 8.5 24.1 20 27.2 11.5-3.1 20-14.7 20-27.2v-15L32 8z" fill="#0d1424" opacity="0.92" />
  
  <!-- Credit Trend Line & Checkmark Symbol -->
  <path d="M22 33l7 7 15-16" stroke="url(#cn-grad-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cn-glow)" />
  
  <!-- Accent Tech Dots -->
  <circle cx="32" cy="18" r="2.5" fill="#38bdf8" />
  <circle cx="18" cy="24" r="2" fill="#818cf8" />
  <circle cx="46" cy="24" r="2" fill="#34d399" />
</svg>